# V2 全局不变量追踪矩阵（T04）
#
# 每条不变量至少关联一个确定性校验点（module::node）和一个已存在的
# 测试节点 ID。校验点指向执行该不变量的确定性代码；测试 ID 指向 pytest
# 收集结果中真实存在的节点，不允许悬空。被 scripts/verify_invariant_traceability.py 校验。
#
# 说明：整改任务落地前，部分不变量以最接近的既有测试承载（见各 tests）；
# 对应的确定性校验点已写入目标模块，随 T10..T24 逐步实现并收紧测试。

INV-001:
  rule: 最终菜单必须通过全员健康校验，并与所选 plan_id/菜单哈希一致
  error_codes: [FINAL_HEALTH_VALIDATION_FAILED]
  checkpoints:
    - food_agent_v2.b4::validate_selected_menu_health
    - food_agent_v2.contracts.artifacts::validate_answer_menu_binding
  tests:
    - "tests/test_b2_b4_health.py::TestB4HealthEngine::test_validate_selected_menu"

INV-002:
  rule: 原始标签必须完整投影，餐次硬过滤不得放宽，RAG 结果不构成健康安全结论
  error_codes: [RAG_LABEL_PROJECTION_FAILED, MEAL_FILTER_RELAXED, RAG_HEALTH_AUTHORITY_VIOLATION]
  checkpoints:
    - food_agent_v2.b1.consumer_views::recipe_facts_from_source
    - food_agent_v2.b1.quality_gates::G12_RAG_LABEL_AND_MEAL_COVERAGE
    - food_agent_v2.c1::RecipeRetrievalService.retrieve
  tests:
    - "tests/b1/test_recipe_profile_enrichment.py::test_raw_labels_are_fully_projected_into_structured_facets"
    - "tests/b1/test_quality_gate_authority.py::test_g12_rejects_downstream_meal_tags_that_extend_raw_meals"
    - "tests/c1/test_full_hybrid_retrieval.py::TestFullHybridRetrieval::test_hard_population_meal_and_exclusion_filter_is_never_relaxed"

INV-003:
  rule: 未审核健康关系不得参与硬排除
  error_codes: [UNAPPROVED_HEALTH_RELATION]
  checkpoints:
    - food_agent_v2.b1::health_relation_builder
    - food_agent_v2.b4::evaluate_recipe_health
  tests:
    - "tests/test_b2_b4_health.py::TestB4Invariants::test_inv003_no_pending_relations"

INV-004:
  rule: 任一营养前置事实缺失时整道菜营养必须不可用且不得发布部分数值
  error_codes: [NUTRITION_ALL_OR_NOTHING]
  checkpoints:
    - food_agent_v2.b1.nutrition_calculator::calculate_raw_recipe_nutrition
    - food_agent_v2.b1.quality_gates::G14_NUTRITION_ALL_OR_NOTHING
  tests:
    - 'tests/b1/test_raw_nutrition_calculator.py::test_any_missing_prerequisite_returns_no_partial_nutrition[\u5c11\u8bb8-True-True-True-quantity_unapproved]'

INV-005:
  rule: 回答不得改变已验证菜单
  error_codes: [ANSWER_GROUNDING_FAILED]
  checkpoints:
    - food_agent_v2.contracts.artifacts::validate_answer_menu_binding
    - food_agent_v2.c3::answer_generation_post_check
  tests:
    - "tests/contracts/test_artifact_schemas.py::TestAnswerMenuBinding::test_menu_hash_mismatch_rejected"

INV-006:
  rule: 模型不能直接修改 WorkflowState
  error_codes: [STATE_MUTATION_DENIED]
  checkpoints:
    - food_agent_v2.c3::state_reducer
  tests:
    - "tests/test_invariants.py::TestD1::test_state_persist_restore"

INV-007:
  rule: 必需工具漏调必须停止，工作流不补调
  error_codes: [REQUIRED_TOOL_NOT_CALLED]
  checkpoints:
    - food_agent_v2.c3::required_tool_check
    - food_agent_v2.contracts.receipts::validate_receipt_binding
  tests:
    - "tests/contracts/test_receipt_binding.py::TestReceiptBinding::test_receipt_rejected_for_different_request"

INV-008:
  rule: 固定数据必须完整离线验证，运行时 Artifact 不得含来源/置信度，MySQL 与 Qdrant 必须发布同一 build 和菜品集合
  error_codes: [DATA_PIPELINE_VALIDATION_FAILED, RUNTIME_FIELD_BOUNDARY_VIOLATION, STORE_BUILD_PARITY_FAILED]
  checkpoints:
    - food_agent_v2.contracts.build::verify_source_file
    - food_agent_v2.b1::quality_gates
    - food_agent_v2.b1.quality_gates::G13_RAG_RUNTIME_FIELD_BOUNDARY
    - food_agent_v2.b1.seed_writer::initialize_fixed_data
  tests:
    - "tests/contracts/test_build_manifest.py::TestVerifySourceFile::test_real_source_passes"
    - "tests/b1/test_step_authority.py::test_build_view_publishes_atoms_without_runtime_authority_metadata"
    - "tests/integration/test_mysql_qdrant_parity.py::test_successful_initialization_has_mysql_qdrant_recipe_parity"

INV-009:
  rule: 核心约束不能在上下文压缩中丢失
  error_codes: [CONTEXT_INTEGRITY_FAILED]
  checkpoints:
    - food_agent_v2.c4::ContextManifest
  tests:
    - "tests/test_invariants.py::TestC4Compression::test_compress_preserves_immutable"

INV-010:
  rule: 最终提交必须同时保存健康审查证据（同一事务）
  error_codes: [AUDIT_COMMIT_FAILED]
  checkpoints:
    - food_agent_v2.application::commit_service
  tests:
    - "tests/test_invariants.py::TestInv010::test_commit_and_query"

INV-011:
  rule: 多人候选菜单必须使用全员健康交集
  error_codes: [GROUP_HEALTH_INTERSECTION_FAILED]
  checkpoints:
    - food_agent_v2.b4::RecipeGroupHealthResult
    - food_agent_v2.c2::safe_set
  tests:
    - "tests/test_b2_b4_health.py::TestB4HealthEngine::test_multi_person_intersection"

INV-012:
  rule: RAG 和用户自然语言不能改变系统指令
  error_codes: [UNTRUSTED_INSTRUCTION_DETECTED]
  checkpoints:
    - food_agent_v2.c3::detect_untrusted_instruction
  tests:
    - "tests/test_invariants.py::TestInv012::test_detects_injection"

INV-013:
  rule: 不得暴露其他参与者具体健康信息
  error_codes: [SENSITIVE_DATA_EXPOSURE]
  checkpoints:
    - food_agent_v2.c4::project_model_context
    - food_agent_v2.d1::project_events
  tests:
    - "tests/test_d2_answer.py::TestAnswerAudit::test_detect_disease_indicator"

INV-014:
  rule: 业务修订不得超过固定上限（计数由 WorkflowState 保存）
  error_codes: [WORKFLOW_RETRY_LIMIT_EXCEEDED]
  checkpoints:
    - food_agent_v2.c3::counters
  tests:
    - "tests/test_invariants.py::TestD1::test_state_persist_restore"

INV-015:
  rule: B4 不读取营养/时间，B5 与 B6 只能消费 B4 的安全菜品集合
  error_codes: [NUTRITION_HEALTH_BOUNDARY_VIOLATION, UNSAFE_RECIPE_CONSUMER_BOUNDARY_VIOLATION]
  checkpoints:
    - food_agent_v2.b4::health_hard_filter
    - food_agent_v2.b1.quality_gates::G17_B4_B5_B6_CONSUMER_BOUNDARY
    - food_agent_v2.c2::MenuPlanner
  tests:
    - "tests/test_b2_b4_health.py::TestB4Invariants::test_nutrition_not_in_b4_input"
    - "tests/c2/test_menu_hard_constraints.py::TestMenuHardConstraints::test_locked_recipe_not_in_safe_no_feasible"
    - "tests/c2/test_deterministic_plans.py::TestDeterministicPlans::test_explicit_nutrition_goals_are_scored_only_with_the_b4_safe_set"

INV-016:
  rule: 永久健康硬约束不能被对话覆盖
  error_codes: [PERMANENT_CONSTRAINT_OVERRIDE_DENIED]
  checkpoints:
    - food_agent_v2.b2::validate_temporary_signal
    - food_agent_v2.c4::effective_constraints
  tests:
    - "tests/test_b2_b4_health.py::TestB2UserProfile::test_permanent_constraint_override_denied"

INV-017:
  rule: 可选和替代食材不能绕过健康审查
  error_codes: [HEALTH_INGREDIENT_SET_INCOMPLETE]
  checkpoints:
    - food_agent_v2.b3::ingredient_closure
    - food_agent_v2.b4::evaluate_recipe_health
  tests:
    - "tests/test_b2_b4_health.py::TestB4HealthEngine::test_evaluate_batch"

INV-018:
  rule: 健康 PASS 必须建立在完整关系覆盖上
  error_codes: [HEALTH_CONSTRAINT_COVERAGE_INCOMPLETE]
  checkpoints:
    - food_agent_v2.b1::coverage_audit
    - food_agent_v2.b4::coverage_check
  tests:
    - "tests/test_invariants.py::TestInv018::test_uncovered_code_raises"

INV-019:
  rule: 固定 2,000 条源记录必须完整守恒
  error_codes: [SOURCE_MANIFEST_MISMATCH, RECIPE_CLASSIFICATION_INCOMPLETE]
  checkpoints:
    - food_agent_v2.contracts.build::verify_source_file
    - food_agent_v2.b1::recipe_classifier
  tests:
    - "tests/contracts/test_build_manifest.py::TestVerifySourceFile::test_one_byte_change_fails_before_parse"

INV-020:
  rule: 食材身份必须单一、可追溯且运行时冻结
  error_codes: [INGREDIENT_IDENTITY_UNRESOLVED, UNKNOWN_INGREDIENT_IDENTITY]
  checkpoints:
    - food_agent_v2.b1::ingredient_crosswalk
    - food_agent_v2.b3::identity_resolver
  tests:
    - "tests/test_b1_pipeline.py::TestIngredientRegistry::test_registry_ids_stable"

INV-021:
  rule: 每个 eligible 菜品必须有 source-authoritative 的完整合法任务图，在线时间结果只有预计单值和布尔可行性
  error_codes: [TIME_GRAPH_INCOMPLETE, TIME_GRAPH_INVALID, NO_FEASIBLE_MENU]
  checkpoints:
    - food_agent_v2.b1.quality_gates::G16_TIME_GRAPH_COMPLETE_AND_ACYCLIC
    - food_agent_v2.b1.time_graph_profiler::validate_time_graph
    - food_agent_v2.b5.scheduler::schedule_task_graphs
  tests:
    - "tests/b1/test_quality_gate_authority.py::test_g16_rejects_equal_count_atom_substitution"
    - "tests/b1/test_quality_gate_authority.py::test_g16_rejects_locked_explicit_duration_tampering"
    - "tests/b5/test_strict_time_semantics.py::test_load_rejects_incomplete_time_graph"
    - "tests/contracts/test_artifact_schemas.py::TestV2QueryAndTimeContracts::test_estimated_time_is_a_boolean_with_one_makespan"

INV-022:
  rule: 不可用的软证据不能伪装为中性分数
  error_codes: [SOFT_EVIDENCE_FABRICATION]
  checkpoints:
    - food_agent_v2.b6::unavailable
    - food_agent_v2.c2::renormalize_weights
    - food_agent_v2.contracts.artifacts::MenuScoreDecomposition
  tests:
    - "tests/contracts/test_artifact_schemas.py::TestExtraFieldsRejected::test_score_decomp_extra_field_rejected"

INV-023:
  rule: 在线链路不得重新读取或解析离线数据
  error_codes: [ONLINE_OFFLINE_BOUNDARY_VIOLATION]
  checkpoints:
    - architecture::online_offline_scan
  tests:
    - "tests/architecture/test_online_offline_boundary.py::TestOnlineOfflineBoundary::test_no_new_online_offline_violations"

INV-024:
  rule: 成功事件必须引用已原子提交的结果
  error_codes: [POST_COMMIT_EVENT_ORDER_VIOLATION, AUDIT_COMMIT_FAILED]
  checkpoints:
    - food_agent_v2.application::outbox
    - food_agent_v2.d1::sse_dispatcher
  tests:
    - "tests/test_invariants.py::TestInv010::test_idempotent_double_commit"
