services:
  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME:-food_agent_v2_mysql}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-foodagent_v2}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-food_agent_v2}
      MYSQL_USER: ${MYSQL_USER:-foodagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-foodagent_v2}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_v2_data:/var/lib/mysql
      - ./db/schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ${QDRANT_CONTAINER_NAME:-food_agent_v2_qdrant}
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "${QDRANT_REST_PORT:-6335}:6333"
      - "${QDRANT_GRPC_PORT:-6336}:6334"
    volumes:
      - qdrant_v2_data:/qdrant/storage
    healthcheck:
      # qdrant 镜像无 wget/curl；用 bash /dev/tcp 真实请求 /healthz 并核对响应体。
      test: ["CMD-SHELL", "timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"healthz check passed\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-food_agent_v2_redis}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_v2_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_v2_data:
  qdrant_v2_data:
  redis_v2_data:
